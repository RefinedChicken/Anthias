# vim: ft=yaml.docker-compose

services:
  anthias-server:
    # Explicit image tag so anthias-celery below can reference the same
    # built image without a duplicate `build:` block (which would
    # produce a separate, byte-identical-but-distinct image tag).
    image: anthias-server:dev
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports:
      - 8000:8080
    environment:
      - HOME=/data
      - LISTEN=0.0.0.0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    volumes:
      - anthias-data:/data
      - ./:/usr/src/app/

  anthias-celery:
    # Reuses anthias-server:dev via the explicit image tag above.
    # Compose builds anthias-server first (it owns the build:) and
    # this service inherits the same image, only overriding CMD.
    image: anthias-server:dev
    depends_on:
      anthias-server:
        condition: service_started
      redis:
        condition: service_healthy
    command: >
      nice -n 19 ionice -c 3
      celery -A anthias_server.celery_tasks.celery worker -B -n worker@anthias
      --loglevel=info --scheduler celery.beat.Scheduler
    environment:
      - HOME=/data
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=development
    restart: always
    volumes:
      - anthias-data:/data
      - ./:/usr/src/app/

  anthias-fleet:
    # Reuses anthias-server:dev — same trick as anthias-celery above,
    # just a different ANTHIAS_SERVICE/command instead of a second
    # ~825MB image build. See django_project/settings.py's
    # ANTHIAS_SERVICE == 'fleet' branches (INSTALLED_APPS, ROOT_URLCONF,
    # DATABASES) for what actually changes at runtime.
    image: anthias-server:dev
    depends_on:
      anthias-server:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - 8001:8080
    environment:
      - HOME=/data
      - LISTEN=0.0.0.0
      - ANTHIAS_SERVICE=fleet
      - ENVIRONMENT=development
      # Same DB 1 as anthias-fleet-celery below — without this, a web
      # request that calls .delay() (bulk asset push, template apply)
      # falls back to celery_tasks.py's bare-host default
      # (redis://localhost:6379/0), which doesn't resolve inside this
      # container and 500s the request. The scheduled heartbeat sweep
      # never surfaced this: it only ever runs from
      # anthias-fleet-celery, which already sets these.
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    restart: always
    volumes:
      # Deliberately a separate named volume, never anthias-data — a
      # misconfigured fleet container must not be able to read/write a
      # player's own asset DB even if someone fat-fingers the compose
      # file later.
      - anthias-fleet-data:/data
      - ./:/usr/src/app/

  anthias-fleet-celery:
    # Reuses anthias-server:dev — same trick as anthias-celery above,
    # just ANTHIAS_SERVICE=fleet instead of a second ~825MB image
    # build.
    image: anthias-server:dev
    depends_on:
      anthias-fleet:
        condition: service_started
      redis:
        condition: service_healthy
    command: >
      nice -n 19 ionice -c 3
      celery -A anthias_server.celery_tasks.celery worker -B -n worker@anthias-fleet
      --loglevel=info --scheduler celery.beat.Scheduler
    environment:
      - HOME=/data
      - ANTHIAS_SERVICE=fleet
      - ENVIRONMENT=development
      # Deliberately DB 1, not the player anthias-celery's DB 0 — the
      # fleet's independently-scheduled beat/worker pool must not
      # cross-talk with a player's broker/result-backend namespace on
      # the same shared redis instance.
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    restart: always
    volumes:
      # Same volume as anthias-fleet — they share one fleet DB.
      - anthias-fleet-data:/data
      - ./:/usr/src/app/

  redis:
    platform: "linux/amd64"
    image: mirror.gcr.io/library/redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
    anthias-data:
    anthias-fleet-data:
    redis-data:
