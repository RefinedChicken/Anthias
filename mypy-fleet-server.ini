# Separate mypy config for src/anthias_fleet_server — the django-stubs
# mypy plugin supports only one `django_settings_module` per run, and
# anthias_fleet_server is a second, separate Django project (own app
# registry, own database) from anthias_server, whose settings module
# pyproject.toml's [tool.django-stubs] already points at. Run as its
# own invocation:
#
#   uv run mypy --config-file mypy-fleet-server.ini src/anthias_fleet_server
#
# Mirrors pyproject.toml's [tool.mypy] settings otherwise.

[mypy]
python_version = 3.13
strict = True
follow_imports = normal
mypy_path = src:stubs
explicit_package_bases = True
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
exclude = /migrations/

[mypy.plugins.django-stubs]
django_settings_module = anthias_fleet_server.django_project.settings
